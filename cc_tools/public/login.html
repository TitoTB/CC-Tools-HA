<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CC Tools</title>
    <link rel="icon" type="image/png" href="/assets/app-icon.png">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel">
        <h1 class="brand-title"><img src="/assets/app-icon.png" alt=""> <span>CC Tools</span></h1>
        <form id="login-form" class="form-stack">
          <label>
            <span>Contraseña</span>
            <input id="password" type="password" autocomplete="current-password" required autofocus>
          </label>
          <label class="remember-row">
            <input id="remember" type="checkbox">
            <span>Recordar contraseña</span>
          </label>
          <button type="submit" class="login-button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M7 10V8a5 5 0 0 1 10 0v2"></path>
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M12 14v2"></path>
            </svg>
            <span>Log In</span>
          </button>
          <p id="login-error" class="form-error" hidden>Contraseña incorrecta.</p>
        </form>
      </section>
    </main>
    <script>
      const form = document.querySelector('#login-form');
      const error = document.querySelector('#login-error');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: document.querySelector('#password').value,
            remember: document.querySelector('#remember').checked
          })
        });
        if (response.ok) {
          window.location.href = '/';
        } else {
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
