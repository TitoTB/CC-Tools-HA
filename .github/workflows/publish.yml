name: Publish container

on:
  push:
    branches:
      - main
    paths:
      - cc_tools/config.yaml
      - .github/workflows/publish.yml

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: cc-tools-ha

concurrency:
  group: publish-cc-tools
  cancel-in-progress: false

jobs:
  init:
    name: Initialize publication
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.app.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' cc_tools/config.yaml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "Could not read the app version from cc_tools/config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/titotb

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: cc_tools
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          labels: |
            io.hass.name=CC Tools
            io.hass.description=Automatiza tareas de Creality Cloud desde Home Assistant
            io.hass.type=app
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs:
      - init
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          registry-prefix: ghcr.io/titotb
